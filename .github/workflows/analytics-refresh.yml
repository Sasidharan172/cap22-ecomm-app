name: analytics-refresh

# On-demand and scheduled warehouse reconciliation. The backend creates a
# REQUESTED run; the analytics worker (Compose locally, a scheduled task in the
# cloud) performs the export/recompute and writes results back to Postgres.
#
# Configure the repository secret CAP22_API_BASE with the public API origin,
# for example https://api.example.com.

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Warehouse target
        type: choice
        options:
          - DUCKDB
          - SNOWFLAKE
        default: DUCKDB

concurrency:
  group: analytics-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Request and verify refresh
    runs-on: ubuntu-latest
    env:
      API_BASE: ${{ secrets.CAP22_API_BASE }}
      TARGET: ${{ inputs.target || 'DUCKDB' }}
    steps:
      - name: Request refresh
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::CAP22_API_BASE secret is not configured"
            exit 1
          fi
          response=$(curl -fsS -X POST "$API_BASE/api/v1/analytics/refresh" \
            -H 'Content-Type: application/json' \
            -d "{\"target\":\"$TARGET\",\"requestedBy\":\"github-actions\"}")
          echo "$response" | jq
          echo "RUN_ID=$(echo "$response" | jq -r .id)" >> "$GITHUB_ENV"

      - name: Wait for the analytics worker
        run: |
          for attempt in $(seq 1 60); do
            run=$(curl -fsS "$API_BASE/api/v1/analytics/runs/$RUN_ID")
            status=$(echo "$run" | jq -r .status)
            echo "attempt $attempt: $status"
            if [ "$status" = "SUCCEEDED" ]; then
              echo "$run" | jq '{status, estimatesExported, estimatesMatched, estimatesMismatched, artifactUri, message}'
              echo "$run" | jq '.results'
              exit 0
            fi
            if [ "$status" = "FAILED" ]; then
              echo "$run" | jq
              echo "::error::Analytics refresh failed"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the analytics worker"
          exit 1
