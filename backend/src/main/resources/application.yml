spring:
  application:
    name: cap22-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?user=[YOUR_PASSWORD]}
    username: ${DB_USER:cap22}
    password: ${DB_PASSWORD:cap22}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  jackson:
    time-zone: UTC

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  auth:
    username: ${APP_USER:admin}
    password: ${APP_PASSWORD:admin123}
